<!doctype html>
<html lang="en">
  <head>
   
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <title>Best Cakes</title>
    <style>
      .carousel-inner {
        display: flex;
      }

      .carousel-item {
        flex: 0 0 100%;
        transition: transform 0.6s ease;
      }

      .card-deck {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }

      .card {
        flex: 1;
        min-width: 200px;
      }
    </style>
  </head>
  <body>
      
   
    <div class="container mt-5">
      <div id="cardCarousel" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
          <!-- Group 1 -->
          <div class="carousel-item active">
            <div class="card-deck">
              <div class="card">
                <img src="https://sallysbakingaddiction.com/wp-content/uploads/2013/04/triple-chocolate-cake-4-850x1276.jpg" class="card-img-top" alt="...">
                <div class="card-body">
                  <h5 class="card-title">Triple Chocolate Cake</h5>
                </div>
              </div>
              <div class="card">
                <img src="https://sallysbakingaddiction.com/wp-content/uploads/2017/12/homemade-strawberry-cake-4-1024x1536.jpg" class="card-img-top" alt="...">
                <div class="card-body">
                  <h5 class="card-title">Straberry Cake</h5>
                </div>
              </div>
              <div class="card">
                <img src="https://sallysbakingaddiction.com/wp-content/uploads/2014/02/frosted-lemon-blueberry-cake-2-1024x1536.jpg" class="card-img-top" alt="...">
                <div class="card-body">
                  <h5 class="card-title">Lemon Blueberry Layer Cake</h5>
                </div>
              </div>
            </div>
          </div>

          <!-- Group 2 -->
          <div class="carousel-item">
            <div class="card-deck">
              <div class="card">
                <img src="https://sallysbakingaddiction.com/wp-content/uploads/2015/03/layer-carrot-cake-2-1024x1536.jpg" class="card-img-top" alt="...">
                <div class="card-body">
                  <h5 class="card-title">Carrot Cake Recipe</h5>
                </div>
              </div>
              <div class="card">
                <img src="https://sallysbakingaddiction.com/wp-content/uploads/2019/01/vanilla-cake-5-850x1276.jpg" class="card-img-top" alt="...">
                <div class="card-body">
                  <h5 class="card-title">Vanilla Cake</h5>
                </div>
              </div>
              <div class="card">
                <img src="https://sallysbakingaddiction.com/wp-content/uploads/2019/02/cream-cheese-pound-cake-5-1024x1536.jpg" class="card-img-top" alt="...">
                <div class="card-body">
                  <h5 class="card-title">Cheese pound Cake</h5>
                </div>
              </div>
            </div>
          </div>
        


        <div class="carousel-item">
          <div class="card-deck">
            <div class="card">
              <img src="https://sallysbakingaddiction.com/wp-content/uploads/2013/03/easy-funfetti-confetti-cake-850x1276.jpg" class="card-img-top" alt="...">
              <div class="card-body">
                <h5 class="card-title">Sprinkle cake</h5>
              </div>
            </div>
            <div class="card">
              <img src="https://sallysbakingaddiction.com/wp-content/uploads/2017/09/best-pumpkin-cake-850x1276.jpg" class="card-img-top" alt="...">
              <div class="card-body">
                <h5 class="card-title">Pumpkin Cake</h5>
              </div>
            </div>
            <div class="card">
              <img src="https://sallysbakingaddiction.com/wp-content/uploads/2021/07/cookies-and-cream-cake-850x1276.jpg" class="card-img-top" alt="...">
              <div class="card-body">
                <h5 class="card-title">Cookie and Cream Cake</h5>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

        <!-- Controls -->
        <a class="carousel-control-prev" href="#cardCarousel" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#cardCarousel" role="button" data-slide="next">
          <span class="carousel-control-next-icon"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

    
  </body>
</html>
